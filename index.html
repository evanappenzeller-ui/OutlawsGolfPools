function generateMockScores(majorId, seed) {
  const out = {};
  const off = ['masters','pga-championship','us-open','the-open'].indexOf(majorId);
  FIELD.forEach((name, i) => {
    const a = ((i+1)*9301 + 49297 + (seed|0)*17 + off*41) % 233280;
    const b = ((i+1)*4787 + (seed|0)*31 + off*53) % 233280;
    const total = Math.floor((a/233280)*26) - 12;
    const round = Math.floor((b/233280)*11) - 5;
    const thruRand = (i*7 + (seed|0)*3 + off) % 22;
    let status, thru;
    if (thruRand >= 18) { status='Finished'; thru=18; }
    else if (thruRand <= 1) { status = 'Tee '+(1+(i%4))+':'+(((i+(seed|0))%6)*10).toString().padStart(2,'0')+' PM'; thru=0; }
    else { status='Thru '+thruRand; thru=thruRand; }
    out[name] = { total, round, status, thru };
  });
  const sorted = [...FIELD].sort((x,y) => out[x].total - out[y].total);
  const counts = {};
  sorted.forEach(g => counts[out[g].total] = (counts[out[g].total]||0)+1);
  let lt=null, lr=1;
  sorted.forEach((g,i) => { if (out[g].total !== lt) { lr=i+1; lt=out[g].total; } out[g].position=lr; out[g].posLabel = (counts[out[g].total]>1?'T':'')+lr; });
  return out;
}

const scoresApi = {
  fetchScores(majorId, simSeed) {
    if (majorId === 'masters') return Promise.resolve(JSON.parse(JSON.stringify(MASTERS_2026_RESULTS)));

    if (majorId === 'the-open') return Promise.resolve(JSON.parse(JSON.stringify(OPEN_2025_RESULTS)));
    return Promise.resolve(generateMockScores(majorId, simSeed||0));
  },
};

function formatScore(n) {
  if (n === 0 || n === undefined || n === null || isNaN(n)) return 'E';
  return n > 0 ? '+'+n : ''+n;
}
function scoreColor(n) {
  if (n === 0 || n == null) return 'text-score-neutral';
  return n < 0 ? 'text-score-good' : 'text-score-bad';
}
function scoreBg(n) {
  if (n === 0 || n == null) return 'pill pill-stone';
  return n < 0 ? 'pill pill-green' : 'pill pill-red';
}
function ScoreText({ value, className, strong }) {
  return <span className={scoreColor(value)+' '+(strong?'font-mono-num':'font-semibold')+' tabular-nums '+(className||'')}>{formatScore(value)}</span>;
}
function lastName(name) { return name.split(' ').slice(-1)[0]; }
function avatarColor(name) {
  const colors = ['#15803d','#a16207','#1d4ed8','#9f1239','#7c2d12','#581c87','#155e75','#b91c1c','#0e7490','#7e22ce','#0d9488'];
  let h=0; for (let i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
  return colors[h % colors.length];
}
function teamMood(rank, total, complete) {
  if (!complete) return null;
  if (rank === 1) return { label:'LEADER', color:'yellow' };
  return null;
}
function tournamentLeader(scores) {
  let best = null;
  Object.entries(scores).forEach(([name,s]) => { if (!best || s.total < best.total) best = { name, total:s.total, status:s.status, posLabel:s.posLabel }; });
  return best;
}
function initialsOf(name) {
  const parts = name.split(/\s+/).filter(Boolean);
  if (parts.length === 0) return '?';
  if (parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
}

function getDraftedNames(ms) {
  const out = new Set();
  Object.values(ms.drafts || {}).forEach(arr => (arr||[]).forEach(n => out.add(n)));
  return out;
}
function getOwnerOf(ms) {
  const out = {};
  Object.entries(ms.drafts || {}).forEach(([m, picks]) => (picks||[]).forEach(g => { out[g] = m; }));
  return out;
}
function getAvailableGolfers(ms) {
  const drafted = getDraftedNames(ms);
  return FIELD.filter(g => !drafted.has(g));
}
function isDraftComplete(ms) {
  const need = ms.poolMembers.length * ms.picksPerTeam;
  return getDraftedNames(ms).size >= need;
}
function getCurrentDrafter(ms) {
  if (isDraftComplete(ms)) return null;
  const order = ms.draftOrder;
  if (!order.length) return null;
  for (let r=0; r<ms.picksPerTeam; r++) {
    for (let i=0; i<order.length; i++) {
      const m = order[i];
      const picks = ms.drafts[m] || [];
      if (picks.length <= r) return { name:m, round:r+1, pickNumber:r*order.length + i + 1 };
    }
  }
  return null;
}
function applyManualScore(s, m) { return m ? Object.assign({}, s, m) : s; }
function computeStandings(ms, rawScores) {
  const N = ms.bestPicksCount || ms.picksPerTeam;
  const teams = ms.poolMembers.map(member => {
    const picks = ms.drafts[member] || [];
    const golfers = picks.map(name => {
      const raw = rawScores[name] || { total:0, round:0, status:'—', thru:0, posLabel:'—' };
      return Object.assign({ name }, applyManualScore(raw, ms.manualScores[name]));
    });
    const eff = g => (g && typeof g.points === 'number') ? g.points : (g.total||0);
    let total = 0;
    if (golfers.length === ms.picksPerTeam && N < ms.picksPerTeam) {
      const idx = golfers.map((g,i) => ({ idx:i, score:eff(g) })).sort((a,b) => a.score-b.score);
      total = idx.slice(0,N).reduce((s,e) => s+e.score, 0);
      const dropped = new Set(idx.slice(N).map(e => e.idx));
      golfers.forEach((g,i) => { if (dropped.has(i)) g.dropped = true; });
    } else {
      total = golfers.reduce((s,g) => s + eff(g), 0);
    }
    return { member, golfers, total, complete:picks.length === ms.picksPerTeam, picksPerTeam:ms.picksPerTeam, bestPicksCount:N };
  });
  const sorted = [...teams].sort((a,b) => { if (a.complete !== b.complete) return a.complete ? -1 : 1; return a.total - b.total; });
  let lt=null, lr=0;
  sorted.forEach((t,i) => { if (!t.complete) { t.rank='—'; return; } if (t.total !== lt) { lr=i+1; lt=t.total; } t.rank=lr; });
  return sorted;
}

function appReducer(state, action) {
  const ns = JSON.parse(JSON.stringify(state));
  switch (action.type) {
    case 'PICK': { const ms = ns.majorsState[action.majorId]; if (getDraftedNames(ms).has(action.golfer)) return state; ms.drafts[action.member] = ms.drafts[action.member]||[]; ms.drafts[action.member].push(action.golfer); ms.lastUpdated=Date.now(); return ns; }
    case 'UNPICK': { const ms = ns.majorsState[action.majorId]; ms.drafts[action.member] = (ms.drafts[action.member]||[]).filter(g => g!==action.golfer); ms.lastUpdated=Date.now(); return ns; }
    case 'RESET_DRAFT': { const ms = ns.majorsState[action.majorId]; ms.drafts = {}; ms.lastUpdated=Date.now(); return ns; }
    case 'ADD_MEMBER': { MAJORS.forEach(m => { const ms = ns.majorsState[m.id]; if (!ms.poolMembers.includes(action.name)) { ms.poolMembers.push(action.name); ms.draftOrder.push(action.name); } }); return ns; }
    case 'REMOVE_MEMBER': { MAJORS.forEach(m => { const ms = ns.majorsState[m.id]; ms.poolMembers = ms.poolMembers.filter(n => n!==action.name); ms.draftOrder = ms.draftOrder.filter(n => n!==action.name); delete ms.drafts[action.name]; }); return ns; }
    case 'SET_ACTIVE_MAJOR': ns.activeMajorId = action.majorId; return ns;
    case 'SIMULATE_UPDATE': { const ms = ns.majorsState[action.majorId]; ms.scoreSeed = (ms.scoreSeed||0)+1; ms.lastUpdated=Date.now(); return ns; }
    case 'SET_MANUAL_SCORE': { const ms = ns.majorsState[action.majorId]; ms.manualScores[action.golfer] = action.score; ms.lastUpdated=Date.now(); return ns; }
    case 'CLEAR_MANUAL_SCORE': { const ms = ns.majorsState[action.majorId]; delete ms.manualScores[action.golfer]; ms.lastUpdated=Date.now(); return ns; }
    case 'MOVE_DRAFTER': {
      const ms = ns.majorsState[action.majorId];
      const order = [...ms.draftOrder];
      const idx = order.indexOf(action.name);
      if (idx < 0) return state;
      const swap = action.direction === 'up' ? idx - 1 : idx + 1;
      if (swap < 0 || swap >= order.length) return state;
      [order[idx], order[swap]] = [order[swap], order[idx]];
      ms.draftOrder = order;
      ms.lastUpdated = Date.now();
      return ns;
    }
    case 'SHUFFLE_DRAFT_ORDER': {
      const ms = ns.majorsState[action.majorId];
      const order = [...ms.draftOrder];
      for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
      ms.draftOrder = order;
      ms.lastUpdated = Date.now();
      return ns;
    }
    case 'SET_DRAFT_ORDER': {
      const ms = ns.majorsState[action.majorId];
      ms.draftOrder = [...action.order];
      ms.lastUpdated = Date.now();
      return ns;
    }
    case 'RESET_ALL': return defaultAppState();
    default: return state;
  }
}

}
function FlagIcon({ className }) {

function TrophyIcon({ className }) {
  return <svg viewBox="0 0 24 24" className={className} fill="currentColor"><path d="M8 4h8v3a4 4 0 11-8 0V4z"/><path d="M5 5h2v2a2 2 0 11-2-2zm12 0h2a2 2 0 11-2 2V5z" opacity="0.6"/><path d="M9 12h6l-.5 4h-5L9 12zm-1 5h8v2H8v-2z"/></svg>;

              ) : tLeader ? (
                <>
                  <div className="font-ticker text-[11px] flex items-center justify-center gap-1.5" style={{color:'var(--accent-green)'}}>
                    <TrophyIcon className="w-3.5 h-3.5"/> LEADING THE FIELD
                  </div>
                  <div className="font-headline text-3xl uppercase mt-3 leading-tight" style={{color:'var(--text-1)'}}>{tLeader.name}</div>
                  <div className="font-mono-num text-5xl mt-3 green-text">{formatScore(tLeader.total)}</div>

function PoolLeaderboard({ standings, compact, onMemberClick }) {
  if (!standings || standings.length === 0) return null;
  return (
    <Card className="overflow-hidden">
      <div className="grid grid-cols-12 px-4 py-3 font-ticker text-[11px]" style={{background:'rgba(0,0,0,0.4)', color:'var(--text-2)', borderBottom:'1px solid var(--border)'}}>
        <div className="col-span-1">POS</div>
        <div className="col-span-7">PLAYER</div>
        <div className="col-span-2 text-right">PICKS</div>
        <div className="col-span-2 text-right">SCORE</div>
      </div>
      <div>
        {standings.map((t) => {
          const pcls = t.complete && t.rank===1 ? 'podium-1' : t.complete && t.rank===2 ? 'podium-2' : t.complete && t.rank===3 ? 'podium-3' : '';
          return (
            <div key={t.member} className={pcls}>
              <button onClick={() => onMemberClick && onMemberClick(t.member)}
                className="w-full grid grid-cols-12 items-center px-4 py-3 transition-colors text-left"
                style={{borderBottom:'1px solid var(--border)'}}
                onMouseEnter={(e) => e.currentTarget.style.background = 'rgba(255,255,255,0.025)'}
                onMouseLeave={(e) => e.currentTarget.style.background = 'transparent'}>
                <div className="col-span-1 flex items-center gap-2">
                  {t.complete && t.rank<=3 ? <Medal rank={t.rank}/> : <span className="font-mono-num text-xl" style={{color:'var(--text-2)'}}>{t.rank}</span>}
                </div>
                <div className="col-span-7 flex items-center gap-3 min-w-0 pl-1">
                  <div className="w-9 h-9 rounded-md grid place-items-center font-semibold text-sm flex-shrink-0" style={{background:avatarColor(t.member), color:'#fff', boxShadow:'0 0 0 1px rgba(255,255,255,0.08)'}}>{t.member[0]}</div>
                  <div className="min-w-0">
                    <div className="flex items-center gap-2 flex-wrap">
                      <span className="truncate font-semibold text-[15px]" style={{color:'var(--text-1)'}}>{t.member}</span>
                      {(() => { const m = teamMood(t.rank, standings.length, t.complete); return m ? <Pill color={m.color}>{m.label}</Pill> : null; })()}
                    </div>
                    <div className="text-xs truncate mt-0.5" style={{color:'var(--text-3)'}}>{t.golfers.length===0 ? 'No picks yet' : t.golfers.map(g => lastName(g.name)).join(' · ')}</div>
                  </div>
                </div>
                <div className="col-span-2 text-right font-mono-num text-sm" style={{color:'var(--text-2)'}}>{t.golfers.length}/{t.picksPerTeam || 4}</div>
                <div className="col-span-2 text-right">
                  {t.complete ? <ScoreText value={t.total} strong className="font-mono-num text-2xl"/> : <span style={{color:'var(--text-3)'}}>—</span>}
                </div>
              </button>
              {!compact && t.golfers.length > 0 && (
                <div className="px-4 pb-3 grid sm:grid-cols-2 gap-2" style={{background:'rgba(0,0,0,0.18)'}}>
                  {t.golfers.map(g => <GolferRow key={g.name} g={g} dropped={g.dropped}/>)}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </Card>
  );
}

function GolferRow({ g, dropped }) {
  return (
    <div className={'flex items-center justify-between gap-2.5 px-3 py-2 rounded-md '+(dropped?'opacity-40':'')} style={{background:'rgba(255,255,255,0.025)', border:'1px solid var(--border)'}}>
      <Headshot name={g.name} size="sm"/>
      <div className="min-w-0 flex-1">
        <div className="font-medium text-sm truncate flex items-center gap-1.5" style={{color:'var(--text-1)'}}>
          <span className="truncate">{g.name}</span>
          {dropped && <span className="font-ticker text-[10px] flex-shrink-0" style={{color:'var(--text-3)'}}>DROP</span>}
        </div>
        <div className="text-[11px] truncate" style={{color:'var(--text-3)'}}>{g.posLabel} · {g.status}</div>
      </div>
      <div className="text-right flex-shrink-0">
        <ScoreText value={(typeof g.points==='number')?g.points:g.total} className="font-mono-num text-base"/>
        <div className="text-[10px] tabular-nums" style={{color:'var(--text-3)'}}>
          {g.thru>=18 || g.thru===36 ? <span>raw {formatScore(g.total)}</span> : <span className={scoreColor(g.round)}>{formatScore(g.round)} rd</span>}
        </div>
      </div>
    </div>
  );
}

// TOURNAMENT LEADERBOARD / ODDS BOARD
// ============================================================================

function TournamentLeaderboard({ scores, ownerOf, limit, oddsMode }) {
  limit = limit || 24;
  const rows = useMemo(() => {
    const all = Object.entries(scores).map(([n,s]) => ({ name:n, ...s }));
    if (oddsMode) return all.filter(r => typeof r.oddsValue==='number').sort((a,b) => a.oddsValue-b.oddsValue).slice(0,limit);
    return all.sort((a,b) => a.total-b.total).slice(0,limit);
  }, [scores, limit, oddsMode]);
  if (rows.length === 0) return <Card className="p-6 text-center text-sm" style={{color:'var(--text-3)'}}>{oddsMode?'Odds loading…':'No live scores yet.'}</Card>;
  if (oddsMode) {
    const implied = v => 100/(v+100);
    return (
      <Card className="overflow-hidden">
        <div className="grid grid-cols-12 px-3 py-2.5 font-ticker text-[11px]" style={{background:'rgba(0,0,0,0.4)', color:'var(--text-2)', borderBottom:'1px solid var(--border)'}}>
          <div className="col-span-2">RK</div><div className="col-span-6">PLAYER</div><div className="col-span-2 text-right">IMP %</div><div className="col-span-2 text-right">ODDS</div>
        </div>
        <div className="max-h-[640px] overflow-y-auto">
          {rows.map((r,i) => (
            <div key={r.name} className="grid grid-cols-12 items-center px-3 py-2 text-sm transition-colors" style={{borderBottom:'1px solid var(--border)'}}
              onMouseEnter={(e)=> e.currentTarget.style.background='rgba(255,255,255,0.025)'} onMouseLeave={(e)=> e.currentTarget.style.background='transparent'}>
              <div className="col-span-2 flex items-center gap-1.5">
                {i<3 ? <Medal rank={i+1}/> : <span className="font-mono-num text-sm pl-1" style={{color:'var(--text-2)'}}>{i+1}</span>}
              </div>
              <div className="col-span-6 min-w-0 flex items-center gap-2"><Headshot name={r.name} size="sm"/><div className="truncate font-medium" style={{color:'var(--text-1)'}}>{r.name}</div></div>
              <div className="col-span-2 text-right text-xs font-mono-num" style={{color:'var(--text-2)'}}>{(implied(r.oddsValue)*100).toFixed(1)}%</div>
              <div className="col-span-2 text-right font-mono-num text-sm" style={{color:'var(--accent-green)'}}>{r.odds}</div>
            </div>
          ))}
        </div>
      </Card>
    );
  }
  return (
    <Card className="overflow-hidden">
      <div className="grid grid-cols-12 px-3 py-2.5 font-ticker text-[11px]" style={{background:'rgba(0,0,0,0.4)', color:'var(--text-2)', borderBottom:'1px solid var(--border)'}}>
        <div className="col-span-2">POS</div><div className="col-span-5">PLAYER</div><div className="col-span-2 text-right">R</div><div className="col-span-3 text-right">TOTAL · THRU</div>
      </div>
      <div className="max-h-[640px] overflow-y-auto">
        {rows.map((r,i) => {
          const owner = ownerOf[r.name];
          return (
            <div key={r.name} className="grid grid-cols-12 items-center px-3 py-2 text-sm transition-colors" style={{borderBottom:'1px solid var(--border)', background:owner?'rgba(74,222,128,0.04)':'transparent'}}
              onMouseEnter={(e)=> e.currentTarget.style.background = owner?'rgba(74,222,128,0.08)':'rgba(255,255,255,0.025)'}
              onMouseLeave={(e)=> e.currentTarget.style.background = owner?'rgba(74,222,128,0.04)':'transparent'}>
              <div className="col-span-2 flex items-center gap-1.5">
                {i<3 ? <Medal rank={i+1}/> : <span className="font-mono-num text-sm pl-1" style={{color:'var(--text-2)'}}>{r.posLabel}</span>}
              </div>
              <div className="col-span-5 min-w-0 flex items-center gap-2">
                <Headshot name={r.name} size="sm"/>
                <div className="min-w-0 flex-1">
                  <div className="font-medium truncate" style={{color:'var(--text-1)'}}>{r.name}</div>
                  {owner && <div className="text-[10px] flex items-center gap-1 mt-0.5" style={{color:'var(--accent-green)'}}>
                    <span className="w-3 h-3 rounded-sm text-white text-[8px] font-bold grid place-items-center flex-shrink-0" style={{background:avatarColor(owner)}}>{owner[0]}</span><span className="truncate">{owner}</span>
                  </div>}
                </div>
              </div>
              <div className="col-span-2 text-right text-xs font-mono-num"><span className={scoreColor(r.round)}>{formatScore(r.round)}</span></div>
              <div className="col-span-3 text-right">

function StatCard({ label, value, sub, accent, icon }) {

function StatsStrip({ majorId, ms, standings, scores, dispatch }) {
  const completed = standings.filter(t => t.complete);
  const poolLeader = completed[0];
  const tLeader = useMemo(() => tournamentLeader(scores), [scores]);
  const oddsList = useMemo(() => ms.oddsMode ? Object.entries(scores).map(([n,s])=>({name:n,...s})).filter(r => typeof r.oddsValue==='number').sort((a,b)=>a.oddsValue-b.oddsValue) : null, [scores, ms.oddsMode]);
  const fav = oddsList && oddsList[0];
  const totalPicks = ms.poolMembers.length * ms.picksPerTeam;
  const made = Array.from(getDraftedNames(ms)).length;
  const draftLabel = made===totalPicks ? 'COMPLETE' : made===0 ? 'NOT STARTED' : Math.round((made/totalPicks)*100)+'% DONE';
  const updatedTs = new Date(ms.lastUpdated).toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
  return (
    <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
      {ms.oddsMode ? (
        <StatCard label="OUTRIGHT FAV" value={fav?lastName(fav.name):'—'} sub={fav?<span className="font-semibold" style={{color:'var(--accent-green)'}}>{fav.odds}</span>:'—'} icon={<TrophyIcon className="w-3 h-3" style={{color:'var(--accent-gold)'}}/>}/>
      ) : (
        <StatCard label="POOL LEADER" value={poolLeader?poolLeader.member:'—'} sub={poolLeader?<span className={scoreColor(poolLeader.total)+' font-semibold'}>{formatScore(poolLeader.total)} team total</span>:'No complete teams'} icon={<TrophyIcon className="w-3 h-3" style={{color:'var(--accent-gold)'}}/>}/>
      )}
      {ms.oddsMode ? (
        <StatCard label="FIELD" value={oddsList?oddsList.length:'—'} sub="WITH POSTED ODDS" icon={<FlagIcon className="w-3 h-3" style={{color:'var(--accent-green)'}}/>}/>
      ) : (
        <StatCard label="TOURNAMENT LEADER" value={tLeader?lastName(tLeader.name):'—'} sub={tLeader?<span className={scoreColor(tLeader.total)+' font-semibold'}>{formatScore(tLeader.total)} · {tLeader.status}</span>:'—'} icon={<FlagIcon className="w-3 h-3" style={{color:'var(--accent-green)'}}/>}/>
      )}
      <StatCard label="DRAFT" value={made+'/'+totalPicks} sub={draftLabel}/>
      {ms.priorYear ? (
        <StatCard label="PRIOR YEAR" value={String(ms.priorYear)} sub="LAST YEAR'S RESULTS"/>
      ) : ms.isFinal ? (
        <StatCard label="STATUS" value="FINAL" sub={'SUN APR 12 · '+new Date(ms.lastUpdated).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}/>
      ) : ms.oddsMode ? (
        <StatCard label="TEE OFF" value="MAY 14" sub="ARONIMINK · 5 DAYS"/>
      ) : (
        <StatCard label="UPDATED" value={updatedTs} sub={<button onClick={() => dispatch({type:'SIMULATE_UPDATE', majorId})} className="font-semibold hover:underline" style={{color:'var(--accent-green)'}}>Refresh now</button>}/>
      )}
    </div>
  );
}

function RandomizerWheel({ available, currentDrafter, onAssign }) {
  const [rotation, setRotation] = useState(0);
  const [spinning, setSpinning] = useState(false);
  const [winner, setWinner] = useState(null);
  const [openMobile, setOpenMobile] = useState(false);
  const slices = available.length;
  const slice = slices > 0 ? 360 / slices : 0;
  const radius = 140, cx = 150, cy = 150;
  function arcPath(i) {
    if (slices === 1) return 'M '+cx+' '+(cy-radius)+' A '+radius+' '+radius+' 0 1 1 '+cx+' '+(cy+radius)+' A '+radius+' '+radius+' 0 1 1 '+cx+' '+(cy-radius)+' Z';
    const start = i*slice - 90, end = (i+1)*slice - 90;
    const sx = cx + radius * Math.cos(start * Math.PI / 180), sy = cy + radius * Math.sin(start * Math.PI / 180);
    const ex = cx + radius * Math.cos(end * Math.PI / 180), ey = cy + radius * Math.sin(end * Math.PI / 180);
    const large = slice > 180 ? 1 : 0;
    return 'M '+cx+' '+cy+' L '+sx+' '+sy+' A '+radius+' '+radius+' 0 '+large+' 1 '+ex+' '+ey+' Z';
  }
  function handleSpin() {
    if (spinning || slices === 0) return;
    setWinner(null);
    const idx = Math.floor(Math.random() * slices);
    const sliceMid = idx*slice + slice/2;
    const desired = (360 - sliceMid) % 360;
    const current = ((rotation % 360) + 360) % 360;
    const turns = 8 + Math.random()*2;
    const delta = ((desired - current + 360) % 360) + turns*360;
    setRotation(rotation + delta);
    setSpinning(true);
    setTimeout(() => { setSpinning(false); setWinner(available[idx]); }, 6500);
  }
  function assignWinner() { if (!winner || !currentDrafter) return; onAssign(currentDrafter.name, winner); setWinner(null); }
  const sliceColors = ['#0d2818','#16352a','#1f4e3a','#2a6e4a','#3f9669','#1a2e22'];
  const bodyClass = openMobile ? '' : 'hidden lg:block';
  return (
    <Card className="p-4">
      <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
        <button onClick={() => setOpenMobile(o => !o)} className="lg:cursor-default lg:pointer-events-none text-left flex items-center gap-2" aria-expanded={openMobile}>
          <div>
            <div className="font-ticker text-[11px]" style={{color:'var(--text-3)'}}>RANDOM PICK</div>
            <h3 className="font-headline text-2xl uppercase leading-tight" style={{color:'var(--text-1)'}}>Randomizer</h3>
          </div>
          <span className="lg:hidden ml-1 text-xl leading-none w-7 h-7 grid place-items-center rounded-md" style={{color:'var(--text-2)', background:'rgba(255,255,255,0.04)', border:'1px solid var(--border)'}} aria-hidden="true">{openMobile?'−':'+'}</span>
        </button>
        <Pill color={currentDrafter?'fairway':'stone'}>{currentDrafter?'FOR '+currentDrafter.name.toUpperCase():'NO DRAFTER'}</Pill>
      </div>
      <div className={bodyClass}>
      <div className="text-[11px] mb-3" style={{color:'var(--text-3)'}}>Spins a random remaining golfer for the active drafter.</div>
      {slices === 0 ? (
        <div className="text-center py-8 text-sm" style={{color:'var(--text-3)'}}>All golfers drafted.</div>
      ) : (
        <>
          <div className="relative mx-auto" style={{maxWidth:'320px'}}>
            <div className="absolute left-1/2 -translate-x-1/2 -top-1 z-10 pointer-events-none">
              <svg width="28" height="36" viewBox="0 0 28 36">
                <path d="M14 30 L2 6 L26 6 Z" fill="#f5b842" stroke="#451a03" strokeWidth="1.5"/>
                <circle cx="14" cy="6" r="3.5" fill="#0a0e13" stroke="#f5b842" strokeWidth="2"/>
              </svg>
            </div>
            <svg viewBox="0 0 300 300" className={spinning?'wheel-spin':'wheel-idle'} style={{transform:'rotate('+rotation+'deg)', display:'block', width:'100%', filter:'drop-shadow(0 8px 24px rgba(0,0,0,0.5))'}}>
              {available.map((name,i) => {
                const last = lastName(name);
                const angle = i*slice + slice/2 - 90;
                const fill = sliceColors[i % sliceColors.length];
                // Radial text: writing direction runs from inner edge outward.
                // Tangent space (arc length) gates legibility, so for crowded
                // wheels we shrink font + push outward (more arc per slice).
                const fontSize = slices>80 ? 4 : slices>50 ? 5 : slices>30 ? 6.5 : slices>20 ? 8 : slices>12 ? 10 : 12;
                const maxLen  = slices>80 ? 5 : slices>50 ? 6 : slices>30 ? 7   : slices>20 ? 9 : slices>12 ? 11 : 13;
                const textR   = slices>50 ? 0.82 : slices>20 ? 0.70 : 0.60;
                const tx = cx + (radius*textR)*Math.cos(angle*Math.PI/180);
                const ty = cy + (radius*textR)*Math.sin(angle*Math.PI/180);
                // Keep letters upright on both halves of the wheel.
                const normAngle = ((angle % 360) + 360) % 360;
                const textRot = (normAngle > 90 && normAngle < 270) ? angle + 180 : angle;
                return (
                  <g key={name}>
                    <path d={arcPath(i)} fill={fill} stroke="rgba(255,255,255,0.08)" strokeWidth="1"/>
                    <text x={tx} y={ty} fill="#ebe9e1" fontSize={fontSize} fontWeight="700" textAnchor="middle" dominantBaseline="middle" transform={'rotate('+textRot+' '+tx+' '+ty+')'}>{last.length>maxLen?last.slice(0,maxLen):last}</text>
                  </g>
                );
              })}
              <circle cx={cx} cy={cy} r="26" fill="#0a0e13" stroke="#4ade80" strokeWidth="2.5"/>
              <circle cx={cx} cy={cy} r="6" fill="#f5b842"/>
            </svg>
          </div>
          <div className="mt-4 grid gap-2">
            <Button variant="accent" size="lg" onClick={handleSpin} disabled={spinning||slices===0} className="w-full">{spinning?'SPINNING…':'SPIN'}</Button>
            {winner && !spinning && (
              <div className="animate-fade-up rounded-xl p-4 relative overflow-hidden" style={{background:'linear-gradient(135deg, rgba(74,222,128,0.12) 0%, rgba(0,0,0,0) 70%), linear-gradient(180deg, rgba(20,26,35,0.95), rgba(15,19,25,0.95))', border:'1px solid rgba(74,222,128,0.40)', boxShadow:'0 0 32px rgba(74,222,128,0.18)'}}>
                <div className="absolute top-0 left-0 right-0 h-px" style={{background:'linear-gradient(90deg, transparent 0%, rgba(74,222,128,0.7) 50%, transparent 100%)'}}/>
                <div className="font-ticker text-[11px] flex items-center gap-1.5" style={{color:'var(--accent-green)'}}>
                  <span className="w-1.5 h-1.5 rounded-full bg-fairway-500 animate-pulse-soft"/> RESULT
                </div>
                <div className="font-headline text-3xl sm:text-4xl uppercase mt-1.5 leading-tight green-text">{winner}</div>
                {currentDrafter ? (
                  <div className="flex gap-2 mt-4">
                    <Button variant="accent" onClick={assignWinner} className="flex-1">ASSIGN TO {currentDrafter.name.toUpperCase()}</Button>
                    <Button variant="primary" onClick={() => setWinner(null)}>Re-spin</Button>
                  </div>
                ) : <div className="text-xs mt-2" style={{color:'var(--text-3)'}}>No drafter on the clock.</div>}
              </div>
            )}
          </div>
        </>
      )}
      </div>
    </Card>
  );
}

  const ownerOf = useMemo(() => getOwnerOf(ms), [ms]);
  const noTeams = standings.every(t => !t.complete);
  return (
    <section className="max-w-6xl mx-auto px-4 py-6 sm:py-8 space-y-6 animate-fade-up">
      {ms.priorYear && (
        <Card className="p-4" style={{background:'linear-gradient(135deg, rgba(245,184,66,0.10) 0%, rgba(0,0,0,0) 70%), var(--surface)', borderColor:'rgba(245,184,66,0.25)'}}>
          <div className="flex items-start gap-3">
            <div className="w-9 h-9 rounded-md grid place-items-center flex-shrink-0" style={{background:'rgba(245,184,66,0.15)', color:'var(--accent-gold)'}}><FlagIcon className="w-4 h-4"/></div>
            <div className="min-w-0">
              <div className="font-ticker text-[11px]" style={{color:'var(--accent-gold)'}}>{ms.priorYear} RESULTS · LAST YEAR</div>
              <div className="text-sm mt-0.5" style={{color:'var(--text-2)'}}>Showing {ms.priorYear} final results for reference. The 2026 tournament hasn't been scheduled into the pool yet.</div>
            </div>
          </div>
        </Card>
      )}
      <StatsStrip majorId={majorId} ms={ms} standings={standings} scores={scores} dispatch={dispatch}/>
      {ms.oddsMode && (
        <Card className="p-5" style={{background:'linear-gradient(135deg, rgba(245,184,66,0.08) 0%, rgba(0,0,0,0) 70%), var(--surface)', borderColor:'rgba(245,184,66,0.20)'}}>
          <div className="flex items-start gap-3">
            <div className="w-10 h-10 rounded-md grid place-items-center flex-shrink-0" style={{background:'rgba(245,184,66,0.15)', color:'var(--accent-gold)'}}><FlagIcon className="w-5 h-5"/></div>
            <div className="min-w-0">
              <div className="font-headline text-lg uppercase" style={{color:'var(--text-1)'}}>Pre-tournament</div>
              <div className="text-sm mt-0.5" style={{color:'var(--text-2)'}}>Tee off Thursday, May 14. Draft opens whenever you start it.</div>
              <div className="flex flex-wrap gap-2 mt-3">
                <Button size="sm" variant="accent" onClick={() => onNav(majorId, 'draft')}>OPEN DRAFT →</Button>
                {ms.oddsSource && <a href={ms.oddsSource.url} target="_blank" rel="noopener" className="btn-base btn-primary px-3 py-1.5 text-xs">SOURCE: {ms.oddsSource.name.toUpperCase()} ↗</a>}
              </div>
            </div>
          </div>
        </Card>
      )}
      {!ms.oddsMode && noTeams && (
        <Card className="p-5">
          <div className="text-sm" style={{color:'var(--text-2)'}}>Draft is still open. Pool standings populate when teams are complete.</div>
          <div className="mt-2"><Button size="sm" onClick={() => onNav(majorId,'draft')}>Go to draft →</Button></div>
        </Card>
      )}
      <div className="grid lg:grid-cols-5 gap-6">
        <div className="lg:col-span-3 space-y-2">
          <SectionHeader title={ms.oddsMode?'POOL DRAFT PREVIEW':'POOL STANDINGS'} subtitle={ms.oddsMode?'Members are pre-draft':'Sum of best 4 picks · lowest wins'}/>
          <PoolLeaderboard standings={standings} compact={false}/>
        </div>
        <div className="lg:col-span-2 space-y-2">
          <SectionHeader title={ms.oddsMode?'FANDUEL ODDS BOARD':'TOURNAMENT LEADERBOARD'} subtitle={ms.oddsMode?'Outright winner · sorted by implied probability':'Live field · drafted golfers highlighted'}/>
          <TournamentLeaderboard scores={scores} ownerOf={ownerOf} oddsMode={ms.oddsMode}/>
          <Card className="p-4 mt-3">
            <div className="flex items-center justify-between text-xs">
              <span className="font-ticker" style={{color:'var(--text-2)'}}>{ms.priorYear?(ms.priorYear+' RESULTS'):ms.isFinal?'FINAL RESULTS':ms.oddsMode?'PRE-TOURNAMENT ODDS':'LIVE SCORES'}</span>
              <span className="font-mono-num" style={{color:'var(--text-3)'}}>{ms.priorYear?new Date(ms.lastUpdated).toLocaleDateString([], {month:'short', day:'numeric', year:'numeric'}).toUpperCase():ms.isFinal?'APR 12, 2026':ms.oddsMode?'MAY 9, 2026':'UPDATED '+new Date(ms.lastUpdated).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}</span>
            </div>
            <div className="mt-2 text-[11px]" style={{color:'var(--text-3)'}}>
              {ms.priorYear ? ms.priorYear+' final results · last year, shown for reference.' : ms.isFinal?'Final results.' : ms.oddsMode?'FanDuel outright winner odds, retrieved May 9, 2026.':'Mock scores until live data is wired in.'}
            </div>
          </Card>
        </div>
      </div>
    </section>
  );
}

function DraftView({ majorId, ms, scores, available, currentDrafter, draftDone, dispatch, onNav }) {
  function pickGolfer(name) { if (!currentDrafter) return; dispatch({type:'PICK', majorId, member:currentDrafter.name, golfer:name}); }
  function undoPick(member, name) { dispatch({type:'UNPICK', majorId, member, golfer:name}); }
  function assignFromWheel(member, golfer) { dispatch({type:'PICK', majorId, member, golfer, force:true}); }
  function resetDraft() { if (window.confirm('Reset all picks for this tournament?')) dispatch({type:'RESET_DRAFT', majorId}); }
  if (draftDone) {
    return (
      <section className="max-w-3xl mx-auto px-4 py-12 sm:py-20 animate-fade-up">
        <Card className="p-8 sm:p-12 text-center" style={{background:'linear-gradient(135deg, rgba(74,222,128,0.08) 0%, rgba(0,0,0,0) 70%), var(--surface)'}}>
          <div className="w-14 h-14 mx-auto mb-4 rounded-md grid place-items-center" style={{background:'linear-gradient(180deg,#4ade80 0%,#16a34a 100%)', color:'#06140d', boxShadow:'0 0 24px rgba(74,222,128,0.30)'}}><TrophyIcon className="w-7 h-7"/></div>
          <div className="font-ticker text-[11px]" style={{color:'var(--accent-green)'}}>DRAFT</div>
          <h2 className="font-headline text-3xl sm:text-5xl uppercase mt-2" style={{color:'var(--text-1)'}}>Complete</h2>
          <p className="mt-3 max-w-md mx-auto" style={{color:'var(--text-2)'}}>All picks are in. Switch to Live to track scores.</p>
          <div className="flex justify-center gap-2 mt-6 flex-wrap">
            <Button variant="accent" onClick={() => onNav(majorId, 'live')}>VIEW LIVE STANDINGS →</Button>
            <Button variant="primary" onClick={resetDraft}>Reset draft</Button>
          </div>
        </Card>
        <div className="mt-8">
          <SectionHeader title="DRAFTED TEAMS"/>
          <DraftedTeams majorState={ms} scores={scores} onUndo={undoPick}/>
        </div>
      </section>
    );
  }
  const draftStarted = Object.values(ms.drafts || {}).some(p => p && p.length > 0);
  return (
    <section className="max-w-6xl mx-auto px-4 py-6 sm:py-8 space-y-6 animate-fade-up">
      {currentDrafter && <OnTheClockBanner drafter={currentDrafter} ms={ms}/>}
      <div className="grid lg:grid-cols-5 gap-6">
        <div className="lg:col-span-3 space-y-6">
          <DraftOrderEditor majorState={ms} majorId={majorId} dispatch={dispatch} draftStarted={draftStarted}/>
          <AvailableGolfersList available={available} scores={scores} onPick={pickGolfer} currentDrafter={currentDrafter} disabled={!currentDrafter}/>
        </div>
        <div className="lg:col-span-2 space-y-6">
          <DraftedTeams majorState={ms} scores={scores} onUndo={undoPick}/>
          <RandomizerWheel available={available} currentDrafter={currentDrafter} onAssign={assignFromWheel}/>
        </div>
      </div>
    </section>
  );
}

function DraftOrderEditor({ majorState, majorId, dispatch, draftStarted }) {
  const order = majorState.draftOrder || [];
  const drafts = majorState.drafts || {};
  const [openMobile, setOpenMobile] = useState(false);
  function move(name, dir) { dispatch({ type:'MOVE_DRAFTER', majorId, name, direction: dir }); }
  function shuffle() {
    if (draftStarted && !window.confirm('Picks have already been made. Shuffle the order anyway?')) return;
    dispatch({ type:'SHUFFLE_DRAFT_ORDER', majorId });
  }
  function alpha() {
    const sorted = [...majorState.poolMembers].sort((a,b) => a.localeCompare(b));
    if (draftStarted && !window.confirm('Picks have already been made. Reset to A→Z anyway?')) return;
    dispatch({ type:'SET_DRAFT_ORDER', majorId, order: sorted });
  }
  const bodyClass = openMobile ? '' : 'hidden lg:block';
  return (
    <Card className="p-4">
      <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
        <button onClick={() => setOpenMobile(o => !o)} className="lg:cursor-default lg:pointer-events-none text-left flex items-center gap-2 group" aria-expanded={openMobile}>
          <div>
            <div className="font-ticker text-[11px]" style={{color:'var(--text-3)'}}>PICK SEQUENCE</div>
            <h3 className="font-headline text-xl uppercase leading-tight" style={{color:'var(--text-1)'}}>Draft Order</h3>
          </div>
          <span className="lg:hidden ml-1 text-xl leading-none w-7 h-7 grid place-items-center rounded-md" style={{color:'var(--text-2)', background:'rgba(255,255,255,0.04)', border:'1px solid var(--border)'}} aria-hidden="true">{openMobile?'−':'+'}</span>
        </button>
        <div className={'flex gap-2 '+bodyClass}>
          <Button size="sm" onClick={shuffle}>SHUFFLE</Button>
          <Button size="sm" variant="ghost" onClick={alpha}>A→Z</Button>
        </div>
      </div>
      <div className={'space-y-1.5 max-h-[420px] overflow-y-auto pr-1 '+bodyClass}>
        {order.map((name, i) => {
          const picksMade = (drafts[name] || []).length;
          return (
            <div key={name} className="flex items-center gap-2 px-3 py-2 rounded-md" style={{background:'rgba(255,255,255,0.025)', border:'1px solid var(--border)'}}>
              <span className="font-mono-num text-sm w-7 text-right tabular-nums" style={{color:'var(--text-3)'}}>{i+1}</span>
              <div className="w-7 h-7 rounded-md grid place-items-center text-white text-xs font-semibold flex-shrink-0" style={{background: avatarColor(name), boxShadow:'0 0 0 1px rgba(255,255,255,0.06)'}}>{name[0]}</div>
              <span className="flex-1 font-medium text-sm truncate" style={{color:'var(--text-1)'}}>{name}</span>
              <span className="font-mono-num text-[11px]" style={{color:'var(--text-3)'}}>{picksMade}/{majorState.picksPerTeam}</span>
              <div className="flex gap-1">
                <button onClick={() => move(name,'up')} disabled={i===0} className="px-3 py-2 sm:px-2.5 sm:py-1 rounded text-sm sm:text-xs disabled:opacity-25 transition" style={{color:'var(--text-1)', background:'rgba(255,255,255,0.05)', border:'1px solid var(--border)'}} title="Move up">↑</button>
                <button onClick={() => move(name,'down')} disabled={i===order.length-1} className="px-3 py-2 sm:px-2.5 sm:py-1 rounded text-sm sm:text-xs disabled:opacity-25 transition" style={{color:'var(--text-1)', background:'rgba(255,255,255,0.05)', border:'1px solid var(--border)'}} title="Move down">↓</button>
              </div>
            </div>
          );
        })}
      </div>
      <div className={'mt-3 text-[11px] '+bodyClass} style={{color:'var(--text-3)'}}>Pick #1 drafts first. Order snakes back through every round.</div>
    </Card>
  );
}

function MajorPage({ majorId, subTab, state, scores, dispatch, onNav }) {
  const major = MAJORS.find(m => m.id === majorId);
  const ms = state.majorsState[majorId];
  const golferScores = scores[majorId] || {};
  const available = useMemo(() => getAvailableGolfers(ms), [ms]);
  const currentDrafter = useMemo(() => getCurrentDrafter(ms), [ms]);
  const standings = useMemo(() => computeStandings(ms, golferScores), [ms, golferScores]);
  const draftDone = isDraftComplete(ms);
  const isActive = state.activeMajorId === majorId;
  const draftedCount = getDraftedNames(ms).size;
  const totalPicks = ms.poolMembers.length * ms.picksPerTeam;
  const tab = subTab === 'draft' ? 'draft' : 'live';
  return (
    <main>
      <MajorHero major={major} ms={ms} draftDone={draftDone} isActiveMajor={isActive} onNav={onNav}/>
      <MajorTabs majorId={majorId} tab={tab} onNav={onNav} draftDone={draftDone} draftedCount={draftedCount} totalPicks={totalPicks}/>
      {tab === 'live' ? <LiveView majorId={majorId} major={major} ms={ms} scores={golferScores} standings={standings} dispatch={dispatch} onNav={onNav}/> : <DraftView majorId={majorId} ms={ms} scores={golferScores} available={available} currentDrafter={currentDrafter} draftDone={draftDone} dispatch={dispatch} onNav={onNav}/>}
    </main>
  );
}

// ============================================================================
// ADMIN
// ============================================================================

function AdminPanel({ state, dispatch, onNav }) {
  const [newMember, setNewMember] = useState('');
  const [selMajor, setSelMajor] = useState(state.activeMajorId);
  const [manualGolfer, setManualGolfer] = useState(FIELD[0]);
  const ms = state.majorsState[selMajor];
  const [manualMember, setManualMember] = useState(ms.poolMembers[0] || '');
  useEffect(() => { if (!ms.poolMembers.includes(manualMember)) setManualMember(ms.poolMembers[0]||''); }, [selMajor, ms.poolMembers]);
  function addMember() { const n = newMember.trim(); if (!n) return; dispatch({type:'ADD_MEMBER', name:n}); setNewMember(''); }
  function removeMember(name) { if (!window.confirm('Remove '+name+'?')) return; dispatch({type:'REMOVE_MEMBER', name}); }
  function resetDraft() { if (!window.confirm('Reset draft for '+MAJORS.find(m=>m.id===selMajor).name+'?')) return; dispatch({type:'RESET_DRAFT', majorId:selMajor}); }
  function manualAssign() { if (!manualMember) return; dispatch({type:'PICK', majorId:selMajor, member:manualMember, golfer:manualGolfer, force:true}); }
  function setActive() { dispatch({type:'SET_ACTIVE_MAJOR', majorId:selMajor}); }
  function simulate() { dispatch({type:'SIMULATE_UPDATE', majorId:selMajor}); }
  function resetAll() { if (!window.confirm('Reset ALL data?')) return; dispatch({type:'RESET_ALL'}); }
  function exportData() { const data = JSON.stringify(state, null, 2); const blob = new Blob([data], {type:'application/json'}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'pool-backup.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); }
  return (
    <main className="animate-fade-up max-w-6xl mx-auto px-4 py-8 sm:py-12">
      <div className="mb-6">
        <div className="font-ticker text-[11px]" style={{color:'var(--text-3)'}}>POOL ADMIN</div>
        <h1 className="font-headline text-4xl uppercase mt-1" style={{color:'var(--text-1)'}}>Controls</h1>
        <p className="text-sm mt-1" style={{color:'var(--text-2)'}}>Manage members, drafts, and scoring across all four majors.</p>
      </div>
      <div className="grid md:grid-cols-2 gap-4 sm:gap-6">
        <Card className="p-4">
          <h3 className="font-headline text-xl uppercase mb-3" style={{color:'var(--text-1)'}}>Pool Members</h3>
          <div className="space-y-2">
            {ms.poolMembers.map(m => (
              <div key={m} className="flex items-center justify-between px-3 py-2 rounded-md" style={{border:'1px solid var(--border)'}}>
                <div className="flex items-center gap-2 min-w-0">
                  <div className="w-7 h-7 rounded-md grid place-items-center text-white text-xs font-semibold flex-shrink-0" style={{background:avatarColor(m)}}>{m[0]}</div>
                  <span className="font-medium text-sm truncate" style={{color:'var(--text-1)'}}>{m}</span>
                </div>
                <button onClick={() => removeMember(m)} className="text-xs font-semibold flex-shrink-0 transition" style={{color:'var(--score-bad)'}}>Remove</button>
              </div>
            ))}
          </div>
          <div className="mt-3 flex gap-2">
            <input value={newMember} onChange={e=>setNewMember(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addMember()} placeholder="New member name" className="flex-1"/>
            <Button onClick={addMember}>Add</Button>
          </div>
        </Card>
        <Card className="p-4">
          <h3 className="font-headline text-xl uppercase mb-3" style={{color:'var(--text-1)'}}>Tournament</h3>
          <label className="font-ticker text-[10px] block mb-1.5" style={{color:'var(--text-3)'}}>SELECT</label>
          <select value={selMajor} onChange={e => setSelMajor(e.target.value)} className="w-full">
            {MAJORS.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
          </select>
          <div className="grid grid-cols-2 gap-2 mt-4">
            <Button variant={state.activeMajorId===selMajor?'accent':'primary'} onClick={setActive}>{state.activeMajorId===selMajor?'★ ACTIVE':'Mark active'}</Button>
            <Button onClick={simulate}>↻ Simulate update</Button>
            <Button variant="danger" onClick={resetDraft}>Reset draft</Button>
            <Button onClick={() => onNav(selMajor)}>Open page →</Button>
          </div>
        </Card>
        <Card className="p-4">
          <h3 className="font-headline text-xl uppercase mb-3" style={{color:'var(--text-1)'}}>Manual Assign</h3>
          <div className="grid grid-cols-2 gap-2">
            <div>
              <label className="font-ticker text-[10px] block mb-1.5" style={{color:'var(--text-3)'}}>MEMBER</label>
              <select value={manualMember} onChange={e=>setManualMember(e.target.value)} className="w-full">{ms.poolMembers.map(m=><option key={m} value={m}>{m}</option>)}</select>
            </div>
            <div>
              <label className="font-ticker text-[10px] block mb-1.5" style={{color:'var(--text-3)'}}>GOLFER</label>
              <select value={manualGolfer} onChange={e=>setManualGolfer(e.target.value)} className="w-full">{FIELD.map(g=><option key={g} value={g}>{g}</option>)}</select>
            </div>
          </div>
          <Button onClick={manualAssign} className="mt-3" disabled={!manualMember}>Force assign</Button>
        </Card>
        <Card className="p-4 md:col-span-2">
          <h3 className="font-headline text-xl uppercase mb-3" style={{color:'var(--text-1)'}}>Data</h3>
          <div className="flex flex-wrap gap-2">
            <Button onClick={exportData}>Download backup</Button>
            <Button variant="danger" onClick={resetAll}>Reset all data</Button>
          </div>
          <div className="text-[11px] mt-2" style={{color:'var(--text-3)'}}>State saved to localStorage under {STORAGE_KEY}.</div>
        </Card>
      </div>
    </main>
  );
}

// ============================================================================
// APP ROOT
// ============================================================================

function parseHash() {
  const h = (window.location.hash || '').replace(/^#\/?/, '');
  if (!h) return { page:'home', subTab:null };
  const parts = h.split('/').filter(Boolean);
  if (parts[0] === 'admin' || parts[0] === 'home') return { page:parts[0], subTab:null };
  if (MAJORS.find(m => m.id === parts[0])) return { page:parts[0], subTab: parts[1]==='draft'?'draft':'live' };
  return { page:'home', subTab:null };
}

function App() {
  const [state, setState] = useState(() => readStore() || defaultAppState());
  const [route, setRoute] = useState(parseHash);
  const [scores, setScores] = useState({});
  useEffect(() => { writeStore(state); }, [state]);
  useEffect(() => { const onHash = () => setRoute(parseHash()); window.addEventListener('hashchange', onHash); return () => window.removeEventListener('hashchange', onHash); }, []);
  const dispatch = useCallback(action => setState(prev => appReducer(prev, action)), []);
  function nav(page, subTab) {
    let hash = '';
    if (page === 'home') hash = '';
    else if (page === 'admin') hash = '/admin';
    else if (MAJORS.find(m=>m.id===page)) hash = '/'+page+(subTab?'/'+subTab:'');
    setRoute({ page, subTab: subTab || (MAJORS.find(m=>m.id===page)?'live':null) });
    window.location.hash = hash;
    window.scrollTo({ top:0, behavior:'smooth' });
  }
  const seedFp = MAJORS.map(m => state.majorsState[m.id].scoreSeed).join(',');
  useEffect(() => {
    let cancelled = false;
    (async () => {
      const next = {};
      for (const m of MAJORS) next[m.id] = await scoresApi.fetchScores(m.id, state.majorsState[m.id].scoreSeed);
      if (!cancelled) setScores(next);
    })();
    return () => { cancelled = true; };
  }, [seedFp]);
  const { page, subTab } = route;
  return (
    <div className="min-h-screen flex flex-col">
      <Navbar page={page} onNav={nav} activeMajorId={state.activeMajorId}/>
      <div className="flex-1">
        {page === 'home' && <HomePage state={state} scores={scores} onNav={nav}/>}
        {page === 'admin' && <AdminPanel state={state} dispatch={dispatch} onNav={nav}/>}
        {MAJORS.find(m=>m.id===page) && <MajorPage majorId={page} subTab={subTab} state={state} scores={scores} dispatch={dispatch} onNav={nav}/>}
      </div>
      <footer style={{borderTop:'1px solid var(--border)', background:'rgba(0,0,0,0.3)'}}>
        <div className="max-w-6xl mx-auto px-4 py-6 text-xs flex flex-wrap items-center justify-between gap-2 font-ticker" style={{color:'var(--text-3)'}}>
          <div>MAJOR POOL · 2026 SEASON</div>
          <div>14 MEMBERS · 4 MAJORS · BEST 4 OF 5</div>
        </div>
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
